<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time | وقتي</title>
<meta name="description" content="Free planner. قل موعدك بصوتك وينبهك، أو خله يرتب يومك.">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#1b1f3b;--mut:#6b7090;--pri:#4f46e5;--pri2:#7c3aed;--ok:#16a34a;--warn:#dc2626;--bd:#e4e6f0;--sh:0 6px 20px rgba(40,40,100,.08)}
:root[data-theme=dark]{--bg:#0f1226;--card:#181c3a;--ink:#eef0ff;--mut:#9aa0c8;--bd:#262b52;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header{padding:14px 0 6px}
header .wrap{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.6rem;font-weight:800;background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.icons button{background:var(--card);border:1px solid var(--bd);color:var(--ink);width:42px;height:42px;border-radius:12px;font-size:1.05rem;cursor:pointer;margin-inline-start:6px;font-family:inherit}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
h2{margin:0 0 10px;font-size:1rem;color:var(--mut);font-weight:600}
button{font-family:inherit;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.seg button{border:2px solid var(--bd);background:var(--card);color:var(--ink);border-radius:16px;padding:12px 8px;font-size:1rem;font-weight:700;line-height:1.3}
.seg button small{display:block;font-weight:400;color:var(--mut);font-size:.78rem;margin-top:2px}
.seg button.on{border-color:var(--pri);background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.seg button.on small{color:#e6e3ff}
.mode-desc{color:var(--mut);font-size:.92rem;margin:6px 2px 0}
textarea,input[type=text],input[type=time],input[type=date],input[type=number]{font:inherit;font-size:1.02rem;padding:12px 14px;border-radius:14px;border:1.5px solid var(--bd);background:var(--bg);color:var(--ink);width:100%}
textarea{resize:vertical;min-height:70px}
textarea:focus,input:focus{outline:2px solid var(--pri);border-color:transparent}
.btns{display:flex;gap:10px;margin-top:10px}
.mic{flex:none;width:62px;height:54px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:1.5rem}
.mic.rec{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.main{flex:1;border:0;border-radius:16px;background:var(--pri);color:#fff;font-size:1.05rem;font-weight:700;padding:14px}
.ghost{border:1.5px solid var(--bd);background:transparent;color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:600}
.field{margin-top:12px}
.field>label,.field>.lb{display:block;font-size:.85rem;color:var(--mut);margin-bottom:6px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:99px;padding:8px 14px;font-size:.92rem;font-weight:600}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{margin-top:14px;padding:12px;border-radius:14px;background:var(--bg);border:1px dashed var(--pri);font-size:.95rem}
.sum div{padding:2px 0}
.sum .past{text-decoration:line-through;opacity:.5}
.warnt{color:var(--warn);font-size:.9rem;margin-top:8px}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;text-align:center;padding:22px 16px}
.hero .lbl{opacity:.85;font-size:.85rem;font-weight:600}
.hero .big{font-size:1.5rem;font-weight:800;margin:6px 0 2px;word-break:break-word}
.hero .sub{opacity:.92;font-size:.95rem}
.hero .clock{font-size:3.2rem;font-weight:800;direction:ltr;margin:8px 0 0}
.hero .acts{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.hero button{border:0;border-radius:14px;padding:13px 22px;font-size:1.05rem;font-weight:700;min-width:120px}
.hero .go{background:#fff;color:var(--pri)}
.hero .ok{background:rgba(255,255,255,.2);color:#fff}
.hero.empty-h{background:var(--card);color:var(--ink);border:1px dashed var(--bd)}
.hero.empty-h .sub{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.row input[type=checkbox]{width:24px;height:24px;accent-color:var(--ok);flex:none}
.row .tt{flex:1;min-width:0}
.row .tt b{display:block;font-weight:600;word-break:break-word}
.row .tt small{color:var(--mut);display:block}
.row .tm{direction:ltr;color:var(--pri);font-weight:700;font-size:.85rem;flex:none}
.row .x{background:none;border:0;color:var(--mut);font-size:1.1rem;padding:6px}
.row.done b{text-decoration:line-through;opacity:.5}
.pill{border:1.5px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:99px;padding:4px 10px;font-size:.78rem;font-weight:700;flex:none}
.note{color:var(--mut);font-size:.9rem;text-align:center;padding:10px 0}
.over{color:var(--warn);font-size:.88rem;margin-top:8px}
details summary{cursor:pointer;color:var(--mut);font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
.banner{background:var(--card);border:1px solid var(--pri);border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.9rem}
.banner button{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700;white-space:nowrap}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid3 label{display:flex;flex-direction:column;font-size:.82rem;color:var(--mut);gap:4px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hint{color:var(--mut);font-size:.82rem;margin-top:10px}
#toasts{position:fixed;inset-inline:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50;padding:0 12px}
.toast{pointer-events:auto;background:#1b1f3b;color:#fff;border-radius:14px;padding:12px 16px;font-size:.95rem;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:14px;align-items:center;max-width:460px;animation:up .2s}
.toast.alert{background:var(--pri);font-weight:700}
.toast button{background:none;border:0;color:#fbbf24;font-weight:800;font-size:.95rem}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
footer{text-align:center;color:var(--mut);font-size:.78rem;padding:18px 0 80px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap">
  <h1 id="appName">وقتي</h1>
  <div class="icons"><button id="bLang">EN</button><button id="bTheme">🌙</button><button id="bSet" aria-label="settings">⚙️</button></div>
</div></header>

<main class="wrap">
  <div id="banner"></div>
  <div class="seg" id="seg">
    <button data-m="A" id="segA"></button>
    <button data-m="B" id="segB"></button>
  </div>
  <p class="mode-desc" id="modeDesc"></p>

  <!-- ========== MODE A: reminders ========== -->
  <div id="secA">
    <section class="card">
      <h2 id="aH"></h2>
      <textarea id="aText" rows="2"></textarea>
      <div class="btns">
        <button class="mic" id="aMic" aria-label="mic">🎤</button>
        <button class="main" id="aParse"></button>
      </div>
      <div class="hint" id="aEx"></div>
    </section>

    <section class="card" id="aForm" hidden>
      <h2 id="aFormH"></h2>
      <div class="field"><label for="aTitle" id="lTitle"></label><input type="text" id="aTitle"></div>
      <div class="field"><span class="lb" id="lDay"></span>
        <div class="chips" id="aDays"></div>
        <input type="date" id="aDate" style="margin-top:8px">
      </div>
      <div class="field"><label for="aTime" id="lTime"></label><input type="time" id="aTime"></div>
      <div class="field"><span class="lb" id="lOffs"></span><div class="chips" id="aOffs"></div></div>
      <div class="sum" id="aSum"></div>
      <div class="warnt" id="aWarn"></div>
      <div class="btns">
        <button class="ghost" id="aCancel"></button>
        <button class="main" id="aSave"></button>
      </div>
    </section>

    <section class="card">
      <h2 id="aListH"></h2>
      <div id="aList"></div>
    </section>
    <details class="card" id="aPastBox"><summary id="aPastSum"></summary><div id="aPast"></div></details>
  </div>

  <!-- ========== MODE B: auto plan ========== -->
  <div id="secB" hidden>
    <section class="card">
      <h2 id="bH"></h2>
      <textarea id="bText" rows="4"></textarea>
      <div class="btns">
        <button class="mic" id="bMic" aria-label="mic">🎤</button>
        <button class="main" id="bGo"></button>
      </div>
      <div class="hint" id="bEx"></div>
    </section>

    <section class="card hero" id="hero"></section>

    <section class="card">
      <h2 id="bPlanH"></h2>
      <div id="bList"></div>
      <div id="bOver" class="over"></div>
      <div class="btnrow"><button class="ghost" id="bRe"></button></div>
    </section>
    <details class="card" id="bDoneBox"><summary id="bDoneSum"></summary><div id="bDone"></div></details>
  </div>

  <section class="card" id="set" hidden>
    <h2 id="hSet"></h2>
    <div class="grid3">
      <label><span id="lStart"></span><input type="time" id="start"></label>
      <label><span id="lEnd"></span><input type="time" id="end"></label>
      <label><span id="lBrk"></span><input type="number" id="brk" min="0" max="60" step="5"></label>
    </div>
    <div class="btnrow">
      <button class="ghost" id="bNotif"></button>
      <button class="ghost" id="bTest"></button>
      <button class="ghost" id="bWipe"></button>
    </div>
    <div class="hint" id="hintInstall"></div>
  </section>
</main>
<footer id="foot"></footer>
<div id="toasts" aria-live="polite"></div>

/* =====================================================================
   HELPERS
   ===================================================================== */
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dateStr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const timeStr=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const toMin=s=>{const[a,b]=(s||"0:0").split(":").map(Number);return (a||0)*60+(b||0)};
function atTime(base,hhmm,addDays){const d=new Date(base);d.setHours(0,0,0,0);d.setDate(d.getDate()+(addDays||0));const m=toMin(hhmm);d.setHours(Math.floor(m/60),m%60,0,0);return d.getTime()}

function load(){
  const def={lang:(navigator.language||"ar").startsWith("en")?"en":"ar",theme:"light",mode:"A",start:"08:00",end:"22:00",brk:5,
    notif:true,reminders:[],tasks:[],timer:null,over:[]};
  try{
    let s=JSON.parse(localStorage.getItem("time.v3")||"null");
    if(!s){
      const o=JSON.parse(localStorage.getItem("time.v2")||"null");
      if(o)s={lang:o.lang,theme:o.theme,start:o.start,end:o.end,brk:o.brk,
        tasks:(o.tasks||[]).map(x=>({id:x.id||uid(),title:x.title,mins:x.mins||30,imp:x.star?2:1,done:!!x.done}))};
    }
    return {...def,...(s||{})};
  }catch(_){return def}
}
const S=load();
const save=()=>{try{localStorage.setItem("time.v3",JSON.stringify(S))}catch(_){}};
const T=k=>I18[S.lang][k];

function fmtT(ms){
  const d=new Date(ms);let h=d.getHours();const m=pad(d.getMinutes());
  const ar=S.lang==="ar";const ap=h>=12?(ar?"م":"PM"):(ar?"ص":"AM");
  return (h%12||12)+":"+m+" "+ap;
}
function dayLabel(ms,ref){
  const a=new Date(ref||Date.now());a.setHours(0,0,0,0);
  const b=new Date(ms);b.setHours(0,0,0,0);

function renderSumA(){
  const ev=evFromDraft();const now=Date.now();const w=[];
  let html="";
  if(!dA.title.trim())w.push(T("needTitle"));
  if(!dA.time)w.push(T("needTime"));
  if(ev){
    if(ev<=now)w.push(T("evPast"));
    const offs=dA.offs.slice().sort((a,b)=>b-a);
    html=`<div><b>${T("sumH")}</b></div>`;
    if(!offs.length)html+=`<div>—</div>`;
    offs.forEach(m=>{
      const at=ev-m*60000;const past=at<=now;
      html+=`<div class="${past?"past":""}">🔔 ${dayLabel(at)} <bdi>${fmtT(at)}</bdi> · ${offLabel(m)}${past?" ("+T("pastTag")+")":""}</div>`;
    });
    html+=`<div style="margin-top:6px;color:var(--mut)">📌 ${dayLabel(ev)} <bdi>${fmtT(ev)}</bdi></div>`;
  }
  $("aSum").innerHTML=html;$("aSum").hidden=!html;
  $("aWarn").textContent=w.join(" ");
  $("aSave").disabled=w.length>0;$("aSave").style.opacity=w.length?.5:1;
}
function saveA(){
  const ev=evFromDraft();if(!ev||!dA.title.trim()||ev<=Date.now())return;
  const now=Date.now();
  let alerts=[...new Set(dA.offs)].map(m=>({min:m,at:ev-m*60000,fired:false})).filter(a=>a.at>now);
  if(!alerts.length)alerts=[{min:0,at:ev,fired:false}];
  alerts.sort((a,b)=>a.at-b.at);
  S.reminders.push({id:uid(),title:dA.title.trim(),eventAt:ev,alerts});
  save();
  const first=alerts[0];
  toast(`${T("saved")} · 🔔 ${dayLabel(first.at)} ${fmtT(first.at)}`);
  dA=null;$("aForm").hidden=true;$("aText").value="";
  if(notifySupported()&&Notification.permission==="default")askNotif();
  renderAll();
}
function parseA(){
  const tx=$("aText").value.trim();
  if(!tx){toast(T("nothingHeard"));return}
  openFormA(parseReminder(tx));
}
function reminderRow(r,past){
  const al=r.alerts.map(a=>`<span class="${a.fired?"":""}">${a.fired?"✓":"🔔"} <bdi>${fmtT(a.at)}</bdi></span>`).join(" · ");
  return `<div class="row" data-id="${r.id}"><div class="tt"><b>${esc(r.title)}</b>
    <small>📌 ${dayLabel(r.eventAt)} <bdi>${fmtT(r.eventAt)}</bdi></small><small>${al}</small></div>
    <button class="x" aria-label="delete">✕</button></div>`;
}
function renderListsA(){
  const now=Date.now();
  const up=S.reminders.filter(r=>r.alerts.some(a=>!a.fired)||r.eventAt>now).sort((a,b)=>a.eventAt-b.eventAt);
  const pastL=S.reminders.filter(r=>!up.includes(r)).sort((a,b)=>b.eventAt-a.eventAt);
  $("aList").innerHTML=up.length?up.map(r=>reminderRow(r)).join(""):`<div class="note">${T("aNone")}</div>`;
  $("aPastSum").textContent=`${T("aPastS")} (${pastL.length})`;
  $("aPast").innerHTML=pastL.length?pastL.map(r=>reminderRow(r,true)).join("")+`<div class="btnrow"><button class="ghost" id="aClearPast">${T("clearPast")}</button></div>`:`<div class="note">${T("aPastNone")}</div>`;
  const bind=box=>box.querySelectorAll(".row").forEach(row=>{
    row.querySelector(".x").onclick=()=>{
      const i=S.reminders.findIndex(x=>x.id===row.dataset.id);if(i<0)return;
      const[rm]=S.reminders.splice(i,1);save();renderAll();
      toast(T("deleted"),{label:T("undo"),fn:()=>{S.reminders.splice(i,0,rm);save();renderAll()}});
    };
  });
  bind($("aList"));bind($("aPast"));
  const cp=$("aClearPast");if(cp)cp.onclick=()=>{S.reminders=S.reminders.filter(r=>up.includes(r));save();renderAll()};
}

/* =====================================================================
   MODE B : auto plan
   ===================================================================== */
function replan(){
  const u=S.tasks.map((t,i)=>({t,i})).filter(x=>!x.t.done).sort((a,b)=>(b.t.imp-a.t.imp)||(a.i-b.i));
  const now=Date.now();
  const ceil5=Math.ceil(now/300000)*300000;
  let startMs=atTime(now,S.start,0);const endMs=atTime(now,S.end,0);
  let cur,endUse=endMs;
  if(now>=endMs){cur=atTime(now,S.start,1);endUse=atTime(now,S.end,1)}
  else cur=Math.max(startMs,ceil5);
  const over=[];
  u.forEach(({t})=>{
    t.startAt=cur;t.fired=false;cur+=t.mins*60000;if(cur>endUse)over.push(t.title);cur+=(Number(S.brk)||0)*60000;
  });
  S.over=over;save();
}
function planned(){return S.tasks.filter(t=>!t.done).sort((a,b)=>(a.startAt||0)-(b.startAt||0))}
function parseB(){
  const tx=$("bText").value.trim();
  if(!tx){toast(T("nothingHeard"));return}
  const lines=splitTasks(tx);let n=0;
  lines.forEach(l=>{const p=parseTaskLine(l);if(p.title){S.tasks.push({id:uid(),title:p.title,mins:p.mins,imp:p.imp,done:false});n++}});
  replan();$("bText").value="";renderAll();
  toast(T("planned").replace("{n}",n));
  if(notifySupported()&&Notification.permission==="default")askNotif();
}
const IMPI=["🟢","🟡","🔴"];
function rowB(t,done){
  return `<div class="row ${done?"done":""}" data-id="${t.id}"><input type="checkbox" ${done?"checked":""} aria-label="done">
    <div class="tt"><b>${esc(t.title)}</b><small>${t.mins} ${T("mins")}</small></div>
    ${done?"":`<button class="pill" data-a="imp">${IMPI[t.imp]} ${T("imp"+t.imp)}</button><div class="tm"><bdi>${fmtT(t.startAt)}</bdi></div>`}
    <button class="x" aria-label="delete">✕</button></div>`;
}
function tLeft(){const t=S.timer;if(!t)return 0;return t.endAt?Math.max(0,Math.round((t.endAt-Date.now())/1000)):t.left}
const clockTxt=s=>pad(Math.floor(s/60))+":"+pad(s%60);
function startTimer(task){
  unlockAudio();
  if(S.timer&&S.timer.id===task.id)S.timer={id:task.id,endAt:Date.now()+S.timer.left*1000};
  else S.timer={id:task.id,endAt:Date.now()+task.mins*60000};
  save();renderHero();
}
function pauseTimer(){if(!S.timer||!S.timer.endAt)return;S.timer={id:S.timer.id,left:tLeft()};save();renderHero()}
function completeTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  t.done=true;if(S.timer&&S.timer.id===id)S.timer=null;save();renderAll();
  toast(T("nice"),{label:T("undo"),fn:()=>{t.done=false;replan();renderAll()}});
}
function renderHero(){
  const h=$("hero");const t=planned()[0];
  if(!t){h.className="card hero empty-h";h.innerHTML=`<div class="big">${T("noTasks")}</div><div class="sub">${T("noTasksSub")}</div>`;return}
  h.className="card hero";
  const run=S.timer&&S.timer.id===t.id;const running=run&&S.timer.endAt;
  let acts=running?`<button class="go" data-a="pause">${T("pause")}</button>`:(run?`<button class="go" data-a="go">${T("resume")}</button>`:`<button class="go" data-a="go">${T("go")}</button>`);
  acts+=`<button class="ok" data-a="fin">${T("finish")}</button>`;
  h.innerHTML=`<div class="lbl">${T("now")} ${IMPI[t.imp]}</div><div class="big">${esc(t.title)}</div>
    <div class="sub">${t.mins} ${T("mins")} · <bdi>${fmtT(t.startAt)}</bdi></div>
    ${run?`<div class="clock" id="clock">${clockTxt(tLeft())}</div>`:""}<div class="acts">${acts}</div>`;
  h.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(a==="go")startTimer(t);else if(a==="pause")pauseTimer();else completeTask(t.id)});
}
function renderListsB(){
  const p=planned();const rest=p.slice(1);
  $("bList").innerHTML=p.length?p.map(t=>rowB(t,false)).join(""):`<div class="note">${T("bNone")}</div>`;
  const d=S.tasks.filter(t=>t.done);
  $("bDoneSum").textContent=`${T("bDoneS")} (${d.length})`;
  $("bDone").innerHTML=d.length?d.map(t=>rowB(t,true)).join(""):`<div class="note">${T("bDoneNone")}</div>`;
  $("bOver").textContent=S.over&&S.over.length?T("overflow")+S.over.join("، "):"";
  [$("bList"),$("bDone")].forEach(box=>box.querySelectorAll(".row").forEach(row=>{
    const id=row.dataset.id;
    row.querySelector("input").onchange=e=>{
      if(e.target.checked)completeTask(id);
      else{const t=S.tasks.find(x=>x.id===id);if(t){t.done=false;replan();renderAll()}}
    };
    row.querySelector(".x").onclick=()=>{
      const i=S.tasks.findIndex(x=>x.id===id);if(i<0)return;const[rm]=S.tasks.splice(i,1);
      if(S.timer&&S.timer.id===id)S.timer=null;replan();renderAll();
      toast(T("deleted"),{label:T("undo"),fn:()=>{S.tasks.splice(i,0,rm);replan();renderAll()}});
    };
    const pill=row.querySelector('[data-a="imp"]');
    if(pill)pill.onclick=()=>{const t=S.tasks.find(x=>x.id===id);t.imp=(t.imp+1)%3;replan();renderAll()};
  }));
}

/* =====================================================================
   RENDER / EVENTS
   ===================================================================== */
function renderBanner(){
  const b=$("banner");
  if(!notifySupported()||Notification.permission!=="default"){b.innerHTML="";return}
  b.innerHTML=`<div class="banner"><span>${T("banner")}</span><button id="bnOn">${T("bannerBtn")}</button></div>`;
  $("bnOn").onclick=askNotif;
}
function renderStatic(){
  const ar=S.lang==="ar";
  document.documentElement.lang=S.lang;document.documentElement.dir=ar?"rtl":"ltr";document.documentElement.dataset.theme=S.theme;
  $("appName").textContent=T("app");document.title=ar?"وقتي | تنبيهات وترتيب يومك":"Time | Reminders & Day Planner";
  $("bLang").textContent=T("lang");$("bTheme").textContent=S.theme==="dark"?"☀️":"🌙";
  $("segA").innerHTML=`${T("segA")}<small>${T("segAs")}</small>`;$("segB").innerHTML=`${T("segB")}<small>${T("segBs")}</small>`;
  $("segA").classList.toggle("on",S.mode==="A");$("segB").classList.toggle("on",S.mode==="B");
  $("modeDesc").textContent=S.mode==="A"?T("descA"):T("descB");
  $("secA").hidden=S.mode!=="A";$("secB").hidden=S.mode!=="B";
  $("aH").textContent=T("aH");$("aText").placeholder=T("aPh");$("aParse").textContent=T("aParse");$("aEx").textContent=T("aEx");
  $("aFormH").textContent=T("aFormH");$("lTitle").textContent=T("lTitle");$("lDay").textContent=T("lDay");$("lTime").textContent=T("lTime");$("lOffs").textContent=T("lOffs");
  $("aSave").textContent=T("save");$("aCancel").textContent=T("cancel");$("aListH").textContent=T("aListH");
  $("bH").textContent=T("bH");$("bText").placeholder=T("bPh");$("bGo").textContent=T("bGo");$("bEx").textContent=T("bEx");$("bPlanH").textContent=T("bPlanH");$("bRe").textContent=T("bRe");
  $("hSet").textContent=T("hSet");$("lStart").textContent=T("lStart");$("lEnd").textContent=T("lEnd");$("lBrk").textContent=T("lBrk");
  $("bTest").textContent=T("test");$("bWipe").textContent=T("wipe");$("hintInstall").textContent=T("hintInstall");$("foot").textContent=T("foot");
  let nt;if(!notifySupported())nt=T("notifNA");else if(Notification.permission==="granted")nt=S.notif?T("notifOn"):T("notifOff");else if(Notification.permission==="denied")nt=T("notifBlocked");else nt=T("notifOff");
  $("bNotif").textContent=nt;
  if(dA)renderFormA();
}
function renderAll(){renderStatic();renderBanner();renderListsA();renderHero();renderListsB()}

$("seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;save();renderAll()});
$("aParse").onclick=parseA;
$("aCancel").onclick=()=>{dA=null;$("aForm").hidden=true};
$("aSave").onclick=saveA;
$("aTitle").oninput=e=>{dA.title=e.target.value;renderSumA()};
$("aDate").onchange=e=>{dA.date=e.target.value;renderFormA()};
$("aTime").onchange=e=>{dA.time=e.target.value;renderSumA()};
$("aTime").oninput=e=>{dA.time=e.target.value;renderSumA()};
$("bGo").onclick=parseB;
$("bRe").onclick=()=>{replan();renderAll()};
$("bLang").onclick=()=>{S.lang=S.lang==="ar"?"en":"ar";save();renderAll()};
$("bTheme").onclick=()=>{S.theme=S.theme==="dark"?"light":"dark";save();renderStatic()};
$("bSet").onclick=()=>{$("set").hidden=!$("set").hidden};
["start","end","brk"].forEach(k=>{$(k).value=S[k];$(k).onchange=()=>{S[k]=k==="brk"?Math.max(0,Number($(k).value)||0):($(k).value||S[k]);save();replan();renderAll()}});
$("bNotif").onclick=()=>{
  if(!notifySupported()){toast(T("notifNA"));return}
  if(Notification.permission==="denied"){toast(T("notifBlocked"));return}
  if(Notification.permission==="granted"){S.notif=!S.notif;save();renderStatic();return}
  askNotif();
};
$("bTest").onclick=()=>alertUser(T("alertTitle")+T("fallbackTitle"),T("itsNow"));
let wipeArm=false;
$("bWipe").onclick=()=>{
  if(!wipeArm){wipeArm=true;toast(T("wipeAsk"));setTimeout(()=>wipeArm=false,4000);return}
  S.reminders=[];S.tasks=[];S.timer=null;S.over=[];save();wipeArm=false;renderAll();toast(T("wiped"));
};

/* ---------- voice ---------- */
let rec=null,recBtn=null;
async function voice(btn,o){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){toast(T("novoice"),{ms:8000});return}
  if(rec){try{rec.stop()}catch(_){}return}
  try{if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(x=>x.stop())}}
  catch(_){toast(T("micDenied"),{ms:7000});return}
  const langs=S.lang==="ar"?["ar-SA","ar-KW","ar"]:["en-US"];let ti=0;
  const base=o.base?o.base():"";
  const go=()=>{
    const r=new R();rec=r;recBtn=btn;r.lang=langs[ti];r.interimResults=true;r.continuous=!!o.cont;
    r.onstart=()=>{toast(T("listening"),{ms:2500});btn.classList.add("rec");btn.textContent="⏹"};
    r.onresult=e=>{
      const parts=[];for(let i=0;i<e.results.length;i++){const tx=e.results[i][0].transcript.trim();if(tx)parts.push(tx)}
      o.set(parts,base);
    };
    r.onerror=e=>{
      if(e.error==="language-not-supported"&&ti<langs.length-1){ti++;rec=null;go();return}
      if(e.error==="not-allowed"||e.error==="service-not-allowed")toast(T("micDenied"),{ms:7000});
      else if(e.error==="no-speech")toast(T("noSpeech"));else if(e.error==="network")toast(T("micNet"));else toast(T("micErr"));
    };
    r.onend=()=>{rec=null;btn.classList.remove("rec");btn.textContent="🎤";o.end&&o.end()};
    try{r.start()}catch(_){rec=null;toast(T("micErr"))}
  };go();
}
$("aMic").onclick=()=>voice($("aMic"),{set:p=>{$("aText").value=p.join(" ")},end:()=>{if($("aText").value.trim())parseA()}});
$("bMic").onclick=()=>voice($("bMic"),{cont:true,base:()=>$("bText").value.trim(),set:(p,b)=>{$("bText").value=(b?b+"\n":"")+p.join("\n")}});

/* ---------- ticker: timer + alerts ---------- */
setInterval(()=>{
  const now=Date.now();
  const c=$("clock");
  if(S.timer){
    if(c)c.textContent=clockTxt(tLeft());
    if(S.timer.endAt&&tLeft()<=0){
      const t=S.tasks.find(x=>x.id===S.timer.id);S.timer=null;save();
      if(t)alertUser(T("timeUp")+t.title,T("restBreak"));
      renderHero();
    }
  }
  let changed=false;
  S.reminders.forEach(r=>r.alerts.forEach(a=>{
    if(!a.fired&&now>=a.at){
      a.fired=true;changed=true;
      if(now-a.at<6*3600000||r.eventAt>now){
        const body=a.min===0?T("itsNow"):T("remainOf").replace("{x}",offLabel(a.min))+" ("+fmtT(r.eventAt)+")";
        alertUser(T("alertTitle")+r.title,body);
      }
    }
  }));
  S.tasks.forEach(t=>{
    if(!t.done&&t.startAt&&!t.fired&&now>=t.startAt){
      t.fired=true;changed=true;
      if(now-t.startAt<3*3600000)alertUser(T("startNow")+t.title,"");
    }
  });
  if(changed){save();renderListsA();renderHero();renderListsB()}
},1000);
setInterval(()=>{renderHero();renderListsA()},60000);

if("serviceWorker"in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
if(S.tasks.some(t=>!t.done&&!t.startAt))replan();
renderAll();
</script>
